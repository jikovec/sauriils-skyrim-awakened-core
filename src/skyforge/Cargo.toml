[package]
name = "skyforge"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"   # links libloot (GPL-3.0-or-later)
description = "Reproducible, verifiable Skyrim SE mod installation for MO2 on Linux"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
md-5 = "0.11"
sha2 = "0.11"
hex = "0.4"
roxmltree = "0.21"
walkdir = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libloot = "0.29.7"
esplugin = "6"
libc = "0.2"
libloadorder = "18"

[profile.release]
opt-level = 3
